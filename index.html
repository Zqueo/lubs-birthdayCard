<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Contagem Regressiva</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="images\ico.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="container">
            <h1><b>Cortex Pré-Frontal<br>quase formado...<br>Ainda faltam:</b></h1>

            <div class="contador">
                <div class="card">
                    <div class="flip" id="dias">00</div>
                    <span>Dias</span>
                </div>

                <div class="card">
                    <div class="flip" id="horas">00</div>
                    <span>Horas</span>
                </div>

                <div class="card">
                    <div class="flip" id="minutos">00</div>
                    <span>Min</span>
                </div>

                <div class="card">
                    <div class="flip" id="segundos">00</div>
                    <span>Seg</span>
                </div>
            </div>

            <h3><b>Se não aguentar<br>de ansiendade<br>você pode:</b></h3>

            <div class="acoes">
                <button id="btnCard" class="botao-card">
                    Ir para a<br>Próxima Página
                </button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
